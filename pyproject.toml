[project]
name = "kukkuu"
requires-python = ">=3.12, <3.13"
version = "3.21.4"
dependencies = [
    "defusedxml>=0.8.0rc2", # Allow pre-release version, please remove when stable up-to-date
    "django-auditlog",
    "django-cleanup",
    "django-cors-headers",
    "django-csp",
    "django-environ",
    "django-filter",
    "django-graphql-jwt",
    "django-guardian",
    "django-helsinki-health-endpoints",
    "django-helusers @ https://github.com/City-of-Helsinki/django-helusers/archive/refs/tags/django-helusers-v1.2.0.zip",
    "django-ilmoitin",
    "django-parler<2.4",
    "django-storages[azure]",
    "djangorestframework",
    "django~=5.2",
    "drf-spectacular",
    "factory-boy",
    "graphene-django",
    "graphene-file-upload",
    "hashids",
    "helsinki-profile-gdpr-api",
    "markdown",
    "pillow",
    "psycopg[c]",
    "pycountry",
    "pyjwt[crypto]",
    "qrcode",
    "requests",
    "sentry-sdk",
    "social-auth-app-django<6",
    "django-auditlog-extra @ https://github.com/City-of-Helsinki/django-auditlog-extra/archive/bff5fa3921d6821bebdd6be6c9fd20db39d32d54.zip",
    "django-logger-extra",
    "django-resilient-logger",
]

[dependency-groups]
dev = [
    "cryptography",
    "freezegun",
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "requests-mock",
    "responses",
    "syrupy",
]
prod = [
    "uwsgi",
    "uwsgitop",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.ruff]
target-version = "py312"
# While `django-auditlog-extra` is installed directly from Github (instead of Pypi),
# it needs to be excluded, because otherwise CI-environment acts differently with the
# src -python path and it will fail while linting the code.
extend-exclude = ["snapshots", "django-auditlog-extra"]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501"] }

[tool.ruff.lint.isort]
# isort options for ruff:
# https://docs.astral.sh/ruff/settings/#lintisort
known-first-party = ["kukkuu"]

[tool.ruff.format]
docstring-code-format = true # Format code in docstrings

[tool.coverage.run]
# Coverage run options:
# https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
omit = ["*migrations*", "*site-packages*", "*venv*"]

[tool.pytest.ini_options]
# pytest-django options:
# https://pytest-django.readthedocs.io/en/latest/configuring_django.html
DJANGO_SETTINGS_MODULE = "kukkuu.settings"

# pytest options:
# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
norecursedirs = ["node_modules", ".git", "venv*"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
]
